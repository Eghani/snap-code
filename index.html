<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Snapcode is a simple, customizable QR code generator for links."
    />
    <title>Snapcode — Link to QR code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cursor-bubbles" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Snapcode home">
        <span class="brand-mark" aria-hidden="true">⌁</span>
        <span>snapcode</span>
      </a>
      <span class="header-note">simple QR tools</span>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">LINK TO QR CODE</p>
        <h1 id="page-title">Share it in a snap.</h1>
        <p class="intro">
          Paste a link and download a clean QR code ready to share.
        </p>
      </section>

      <section class="generator-card" aria-label="QR code generator">
        <div class="controls">
          <div class="field-group">
            <label for="link-input">Your link</label>
            <input
              id="link-input"
              type="url"
              placeholder="https://example.com"
              autocomplete="url"
              spellcheck="false"
            />
            <p class="field-hint" id="input-message">
              Enter any complete link starting with https://
            </p>
          </div>

          <button class="primary-button" id="generate-button" type="button">
            Generate QR code
            <span aria-hidden="true">→</span>
          </button>
        </div>

        <div class="preview-panel">
          <div class="preview-heading">
            <span>Preview</span>
            <span class="status-dot" id="status-label">Waiting for a link</span>
          </div>
          <div class="qr-stage" id="qr-stage">
            <div class="empty-state" id="empty-state">
              <span class="empty-icon" aria-hidden="true">▦</span>
              <span>Your QR code will appear here</span>
            </div>
            <img id="qr-image" alt="Generated QR code" />
            <canvas id="qr-canvas" aria-hidden="true"></canvas>
          </div>
          <div
            class="download-row"
            id="download-row"
            aria-label="Download QR code formats"
          >
            <button
              class="download-button"
              data-format="png"
              type="button"
              disabled
            >
              Download PNG
            </button>
            <button
              class="download-button"
              data-format="jpg"
              type="button"
              disabled
            >
              Download JPG
            </button>
            <button
              class="download-button"
              data-format="svg"
              type="button"
              disabled
            >
              Download SVG
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Snapcode</span>
      <span>Built by Ehteshamul</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode_UTF8.js"></script>
    <script src="script.js"></script>
  </body>
</html>
